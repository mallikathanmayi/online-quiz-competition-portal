<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(rgba(0,0,0,.6),rgba(13,110,253,.6)),url("background.png");
background-size:cover;
background-position:center;
}

.container{
width:500px;
background:white;
padding:35px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.3);
}

h2{
text-align:center;
color:#0d6efd;
margin-bottom:20px;
}

.input-group{
margin-bottom:15px;
}

.input-group label{
display:block;
font-weight:bold;
margin-bottom:5px;
}

.input-group input,
.input-group select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:6px;
font-size:16px;
}

button{
width:100%;
padding:13px;
background:#0d6efd;
color:white;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#084298;
}

.login{
text-align:center;
margin-top:20px;
}

.login a{
text-decoration:none;
color:#0d6efd;
font-weight:bold;
}

</style>

<script>

function validate(){

let p=document.getElementById("pass").value;
let cp=document.getElementById("cpass").value;

if(p!=cp)
{
alert("Passwords do not match");
return false;
}

return true;

}

</script>

</head>

<body>

<div class="container">

<h2>🎓 Student Registration</h2>

<form action="Registration.php" method="POST" onsubmit="return validate()">

<div class="input-group">
<label>Full Name</label>
<input type="text" name="name" required>
</div>

<div class="input-group">
<label>Email</label>
<input type="email" name="email" required>
</div>

<div class="input-group">
<label>Phone Number</label>
<input type="text" name="phone" maxlength="10" pattern="[0-9]{10}" required>
</div>

<div class="input-group">
<label>College Name</label>
<input type="text" name="college" required>
</div>

<div class="input-group">
<label>Branch</label>
<select name="branch" required>
<option value="">Select Branch</option>
<option>CSE</option>
<option>ECE</option>
<option>EEE</option>
<option>MECH</option>
<option>CIVIL</option>
<option>AIML</option>
<option>DS</option>
</select>
</div>

<div class="input-group">
<label>Year</label>
<select name="year" required>
<option value="">Select Year</option>
<option>1st Year</option>
<option>2nd Year</option>
<option>3rd Year</option>
<option>4th Year</option>
</select>
</div>

<div class="input-group">
<label>Password</label>
<input type="password" name="password" id="pass" required>
</div>

<div class="input-group">
<label>Confirm Password</label>
<input type="password" id="cpass" required>
</div>

<button type="submit" name="register">
Register
</button>

</form>

<div class="login">
Already have an account?
<a href="students/login.html">Login Here</a>
</div>

</div>

</body>
</html>
